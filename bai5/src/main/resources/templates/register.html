<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng ký tài khoản khách hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">
      <div class="card shadow-sm border-primary">
        <div class="card-body p-4">
          <h4 class="text-center fw-bold mb-4">ĐĂNG KÝ TÀI KHOẢN KHÁCH HÀNG</h4>

          <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
          <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

          <form th:action="@{/register}" th:object="${form}" method="post" id="registerForm" novalidate>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Mã Khách Hàng <span class="text-danger">*</span></label>
              <div class="col-sm-8">
                <input type="text" th:field="*{customerCode}" class="form-control"
                       placeholder="6-10 ký tự, chỉ chữ và số" maxlength="10">
                <div class="text-danger small mt-1" th:errors="*{customerCode}"></div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
              <div class="col-sm-8">
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nhập họ tên đầy đủ">
                <div class="text-danger small mt-1" th:errors="*{fullName}"></div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Email <span class="text-danger">*</span></label>
              <div class="col-sm-8">
                <input type="email" th:field="*{email}" class="form-control" placeholder="vd: nguyenvana@email.com">
                <div class="text-danger small mt-1" th:errors="*{email}"></div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
              <div class="col-sm-8">
                <input type="text" th:field="*{phone}" class="form-control" placeholder="Bắt đầu bằng số 0, 10-12 số" maxlength="12">
                <div class="text-danger small mt-1" th:errors="*{phone}"></div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Địa chỉ <span class="text-danger">*</span></label>
              <div class="col-sm-8">
                <textarea th:field="*{address}" class="form-control" placeholder="Nhập địa chỉ chi tiết" rows="2" maxlength="255"></textarea>
                <div class="text-danger small mt-1" th:errors="*{address}"></div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
              <div class="col-sm-8">
                <input type="password" th:field="*{password}" class="form-control" placeholder="Ít nhất 8 ký tự">
                <div class="text-danger small mt-1" th:errors="*{password}"></div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Xác nhận Mật khẩu <span class="text-danger">*</span></label>
              <div class="col-sm-8">
                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu">
                <div class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Ngày sinh</label>
              <div class="col-sm-8">
                <input type="date" th:field="*{dob}" class="form-control">
                <div class="text-danger small mt-1" th:errors="*{dob}"></div>
                <div class="form-text">Nếu nhập, phải đủ 18 tuổi.</div>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-semibold">Giới tính</label>
              <div class="col-sm-8 d-flex gap-3 align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="radio" th:field="*{gender}" th:value="${T(com.example.bai5.domain.Gender).NAM}" id="gNam">
                  <label class="form-check-label" for="gNam">Nam</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" th:field="*{gender}" th:value="${T(com.example.bai5.domain.Gender).NU}" id="gNu">
                  <label class="form-check-label" for="gNu">Nữ</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" th:field="*{gender}" th:value="${T(com.example.bai5.domain.Gender).KHAC}" id="gKhac">
                  <label class="form-check-label" for="gKhac">Khác</label>
                </div>
              </div>
            </div>

            <div class="mb-3 row">
              <div class="col-sm-4"></div>
              <div class="col-sm-8">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" th:field="*{acceptTerms}" id="terms">
                  <label class="form-check-label" for="terms">Tôi đồng ý với các điều khoản dịch vụ <span class="text-danger">*</span></label>
                </div>
                <div class="text-danger small mt-1" th:errors="*{acceptTerms}"></div>
              </div>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
              <button type="submit" class="btn btn-primary px-4">Đăng ký</button>
              <button type="button" class="btn btn-secondary px-4" id="btnReset">Nhập lại</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("btnReset").addEventListener("click", function () {
    document.getElementById("registerForm").reset();
    window.location.href = "/register";
  });
</script>

</body>
</html>
