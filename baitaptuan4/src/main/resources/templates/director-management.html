<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Director Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      --card-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .main-container {
      max-width: 800px;
      margin: 50px auto;
      padding: 0 20px;
    }
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }
    .card-header {
      background: var(--primary-gradient);
      color: white;
      padding: 25px 30px;
      border: none;
    }
    .card-header h2 {
      margin: 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-header h2 i {
      font-size: 1.5rem;
    }
    .card-body {
      padding: 35px;
      background: white;
    }
    .info-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    .info-badge i {
      font-size: 1.1rem;
    }
    .placeholder-content {
      background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
      border-radius: 15px;
      padding: 25px;
      margin: 20px 0;
      border-left: 5px solid #ffc107;
    }
    .placeholder-content p {
      margin: 0;
      color: #856404;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .placeholder-content i {
      font-size: 1.5rem;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-secondary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
    }
    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      color: white;
    }
    .btn-success {
      background: var(--primary-gradient);
      border: none;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(17, 153, 142, 0.4);
    }
    .btn-group-custom {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }
    .feature-list {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }
    .feature-list li {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #6c757d;
    }
    .feature-list li:last-child {
      border-bottom: none;
    }
    .feature-list li i {
      color: #11998e;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="card">
    <div class="card-header">
      <h2><i class="bi bi-person-badge"></i> Director Management</h2>
    </div>
    <div class="card-body">
      
      <div class="info-badge">
        <i class="bi bi-building"></i>
        Organization ID: <span th:text="${orgId}"></span>
      </div>

      

      <h5 class="mt-4 mb-3"><i class="bi bi-list-check me-2"></i>Các chức năng sẽ triển khai:</h5>
      <ul class="feature-list">
        <li><i class="bi bi-plus-circle"></i> Thêm Director mới</li>
        <li><i class="bi bi-pencil-square"></i> Chỉnh sửa thông tin Director</li>
        <li><i class="bi bi-trash"></i> Xóa Director</li>
        <li><i class="bi bi-search"></i> Tìm kiếm Director</li>
      </ul>

      <div class="btn-group-custom">
        <button type="button" class="btn btn-secondary" onclick="history.back()">
          <i class="bi bi-arrow-left me-2"></i>Back to Organization
        </button>
        <button type="button" class="btn btn-success" disabled>
          <i class="bi bi-plus-lg me-2"></i>Add Director
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
